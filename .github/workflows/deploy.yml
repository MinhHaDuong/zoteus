name: Release image

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test

  image:
    needs: test          # green test gate guards the publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3   # arm64 emulation for the multi-arch build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64   # x86 (E2.1.Micro) + ARM (Ampere A1) — both Always-Free shapes
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  npm-publish:
    needs: test                      # green gate guards the publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write                # OIDC → npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      # publishConfig.access=public + provenance from CI OIDC. prepublishOnly re-runs build.
      # Idempotent: skip (don't fail) if this version is already on the registry, so a prior
      # manual publish or a re-pushed tag still lets the `release` job attach the .dxt.
      - name: Publish to npm (skip if version already published)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "@oscardvs/zoteus@${VERSION}" version >/dev/null 2>&1; then
            echo "@oscardvs/zoteus@${VERSION} already on npm — skipping publish."
          else
            npm publish --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  release:
    needs: [test, npm-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write                # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      # Assemble a SELF-CONTAINED .dxt: manifest + icon + built dist + bundled production deps
      # (incl. optional pdfjs-dist for feature parity). Packing dxt/ alone would omit dist/ and
      # node_modules, yielding a broken extension — so stage a complete tree, then pack + verify.
      - name: Build self-contained .dxt
        run: |
          rm -rf dxt-build && mkdir -p dxt-build
          cp dxt/manifest.json dxt/icon.png dxt-build/
          cp -r dist dxt-build/dist
          cp package.json package-lock.json dxt-build/
          (cd dxt-build && npm ci --omit=dev --ignore-scripts --no-audit --no-fund)
          npx --yes @anthropic-ai/dxt pack dxt-build zoteus.dxt
          unzip -l zoteus.dxt | grep -q ' dist/index.js$' || { echo "::error::.dxt missing dist/index.js"; exit 1; }
          unzip -l zoteus.dxt | grep -q 'node_modules/@modelcontextprotocol/sdk/' || { echo "::error::.dxt missing bundled deps"; exit 1; }
      - uses: softprops/action-gh-release@v2
        with:
          files: zoteus.dxt
          generate_release_notes: true
