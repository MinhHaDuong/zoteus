name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pdfjs-dist (optional dep behind get_fulltext page extraction) requires Node >=20.19.
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The build project excludes tests, so the step above never sees them. This one does.
      - run: npm run typecheck:tests
      - run: npm run lint
      - run: npm run build
      # Unit + integration tests. The live e2e suite self-skips without ZOTERO_API_KEY.
      - run: npm test
